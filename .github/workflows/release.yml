# Builds the Windows app on GitHub's Windows machines: tests, then the app
# folder, portable zip and installer (packaging/build.py).
#
# - Push a version tag (git tag -a v0.1.0-beta.3 -m "..." && git push origin
#   v0.1.0-beta.3) to publish a GitHub release with the files, titled e.g.
#   "Winlight 0.1.0 Beta 3". Releases and betas are full releases, marked
#   Latest (so "Download the latest release" links work); only -alpha, -rc
#   and -dev tags become pre-releases, for builds not meant for everyone.
# - A push to main, or running it by hand from the Actions tab, tests and
#   builds the files as a downloadable artifact, without a release.
name: Build Windows app

on:
  push:
    branches: [main]  # tests and builds the files as an artifact, no release
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev,build]" pytest-github-actions-annotate-failures

      - name: Lint
        run: python -m ruff check .

      - name: Test
        # Failures also appear as annotations on the run, readable without logs.
        run: python -m pytest -q --tb=short -ra --junitxml=test-results.xml

      - name: Test counts
        # The documents don't quote test counts; each run reports its own here.
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test-results.xml) {
            [xml]$results = Get-Content test-results.xml
            $suite = $results.testsuites.testsuite
            $passed = [int]$suite.tests - [int]$suite.failures - [int]$suite.errors - [int]$suite.skipped
            "### Tests: $passed passed, $($suite.failures) failed, $($suite.errors) errors, $($suite.skipped) skipped" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            python packaging/build.py --version $env:GITHUB_REF_NAME
          } else {
            python packaging/build.py
          }

      - uses: actions/upload-artifact@v4
        with:
          name: winlight-windows
          path: |
            dist/Winlight-*-setup.exe
            dist/Winlight-*-portable.zip
          if-no-files-found: error

      - name: Name the release
        if: github.ref_type == 'tag'
        id: release
        shell: pwsh
        run: |
          # v0.1.0-beta.3 -> "Winlight 0.1.0 Beta 3"; v1.0.0 -> "Winlight 1.0.0"
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          $parts = $tag -split "-", 2
          $title = "Winlight $($parts[0])"
          if ($parts.Count -gt 1) {
            $label = ($parts[1] -replace "\.", " ")
            $title += " " + $label.Substring(0, 1).ToUpper() + $label.Substring(1)
          }
          $prerelease = if ($tag -match "-(alpha|rc|dev)") { "true" } else { "false" }
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.title }}
          files: |
            dist/Winlight-*-setup.exe
            dist/Winlight-*-portable.zip
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.prerelease == 'false' }}
          generate_release_notes: true
          body: |
            <img src="https://raw.githubusercontent.com/Arnie14/WinLight/${{ github.ref_name }}/docs/screenshots/flyout-light.png" width="300" alt="Winlight">

            Night light and brightness for several displays from one place, each with its own schedule, with night light paused per display for fullscreen apps, listed apps, or automatically for media, games and color work. Windows 11, 64-bit. Free software under the GNU GPL v3.0. New here? [Why Winlight](https://github.com/Arnie14/WinLight/blob/main/docs/why-winlight.md) compares it with Windows' own controls and similar apps; the [changelog](https://github.com/Arnie14/WinLight/blob/main/CHANGELOG.md) lists what changed.

            **Beta** — not code-signed yet. If SmartScreen warns, choose **More info → Run anyway**. If Microsoft Defender flags it, please [submit a false positive](https://www.microsoft.com/wdsi/filesubmission) and open an issue.

            | File | |
            |---|---|
            | `…-setup.exe` | Installer. No admin rights needed. |
            | `…-portable.zip` | Unzip and run `Winlight.exe`. |

            Winlight **replaces** Windows Night Light: turn Windows' one off, or colors are tinted twice. External monitors need **DDC/CI** turned on in their on-screen menu.

            Found a problem? Tray icon → **Report a Problem…**, then [open an issue](https://github.com/Arnie14/WinLight/issues) with the summary and zip. Testers: [checklist](https://github.com/Arnie14/WinLight/blob/main/docs/testing-installer.md).
