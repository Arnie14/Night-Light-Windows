# Builds the Windows app on GitHub's Windows machines: tests, then the app
# folder, portable zip and installer (packaging/build.py).
#
# - Push a version tag (git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1)
#   to publish a GitHub release with the files. Tags with a "-" (beta, rc)
#   become pre-releases.
# - A push to main, or running it by hand from the Actions tab, tests and
#   builds the files as a downloadable artifact, without a release.
name: Build Windows app

on:
  push:
    branches: [main]  # tests and builds the files as an artifact, no release
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt pytest-github-actions-annotate-failures

      - name: Test
        # Failures also appear as annotations on the run, readable without logs.
        run: python -m pytest -q --tb=short -ra

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            python packaging/build.py --version $env:GITHUB_REF_NAME
          } else {
            python packaging/build.py
          }

      - uses: actions/upload-artifact@v4
        with:
          name: winlight-windows
          path: |
            dist/Winlight-*-setup.exe
            dist/Winlight-*-portable.zip
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Winlight-*-setup.exe
            dist/Winlight-*-portable.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            **Beta.** Unsigned, so Windows SmartScreen may say "Windows protected your PC": choose **More info → Run anyway**.

            - **Installer** (`…-setup.exe`): installs for your user only, no administrator rights, with a Start menu entry and an uninstaller.
            - **Portable** (`…-portable.zip`): unzip anywhere and run `Winlight.exe`.

            Brightness control for external monitors needs DDC/CI turned on in the monitor's own menu. Please report problems with the files in `%LOCALAPPDATA%\night-light\Logs` (paste the path into Explorer).
